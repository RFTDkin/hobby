<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケンの趣味ランキング</title>
    <style>
        body {
        background: linear-gradient(135deg, #1a1a1a, #4a4a4a); /* 深色漸層背景 */
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .ranking-container {
            /* border: 2px solid red; */
            padding: 45px;
            width: 45%;
            position:absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .title {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 30px;
        color: aquamarine;
        }
        
        .rank-row {
            display: flex;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid black; 
        }

        .rank-label {
            font-weight: bold;
        }

        .title-f {
            display: flex;
            margin-bottom: 10px;
            padding: 10px 0;
            justify-content: center;
            
        }

        /* circle */
        .button-circle {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
    }

    /* 不同屬性的按鈕顏色 */
    .button-circle:nth-child(2) { background: linear-gradient(145deg, #ff6b6b, #ff4757); top: 20%; left: 30%; transform: translate(-50%, -50%); } /* 火屬性 */
    .button-circle:nth-child(3) { background: linear-gradient(145deg, #48dbfb, #0abde3); top: 20%; right: 30%; transform: translate(50%, -50%); } /* 水屬性 */
    .button-circle:nth-child(4) { background: linear-gradient(145deg, #1dd1a1, #10ac84);  top: 15%; left: 50%; transform: translate(-50%, -50%);} /* 草屬性 */
    .button-circle:nth-child(5) { background: linear-gradient(145deg, #ffd32a, #ffa502); top: 50%; left: 20%; transform: translate(-50%, -50%); } /* 電屬性 */
    .button-circle:nth-child(6) { background: linear-gradient(145deg, #ff9ff3, #f368e0); top: 50%; right: 20%; transform: translate(50%, -50%); } /* 超能力屬性 */
    .button-circle:nth-child(7) { background: linear-gradient(145deg, #a4b0be, #747d8c); bottom: 15%; left: 30%; transform: translate(-50%, 50%);  } /* 鋼屬性 */
    .button-circle:nth-child(8) { background: linear-gradient(145deg, #5f27cd, #341f97); bottom: 15%; right: 25%; transform: translate(-50%, 50%); } /* 幽靈屬性 */
    .button-circle:nth-child(9) { background: linear-gradient(145deg, #ff9f43, #ee5253); bottom: 5%; left: 50%; transform: translateX(-50%); } /* 龍屬性 */

    .button-circle button {
        background: transparent;
        border: none;
        color: white;
        font-weight: bold;
        font-size: 0.9em;
        cursor: pointer;
        padding: 10px;
        width: 100%;
        height: 100%;   
        border-radius: 50%;
        transition: transform 0.3s ease;
    }
    </style>
</head>
<body>
    <div class="ranking-container">
        <div class="title-f">
            <div class="title">ケンの趣味ランキング</div>
        </div>
        <div class="rank-row" style="background-color:aqua;">
            <div class="rank-label">一軍</div>
            <img src="png/pokepoke.png" style="max-width: 20%;">
        </div>
        <div class="rank-row" style="background-color: aliceblue;">
            <div class="rank-label">二軍</div>
            <img src="png/pokepoke.png" style="max-width: 20%;">
        </div>
        <div class="rank-row" style="background-color: antiquewhite;">
            <div class="rank-label">三軍</div>
            <img src="png/pokepoke.png" style="max-width: 20%;">
        </div>
    </div>

    <div class="button-circle">
        <a href="study_game.html">
            <button>基本情報技術者試験勉強ゲーム</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="shopping.html">
            <button>ポケモンショップ</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="index.html">
            <button>ホームページへ</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="hobby.html">
            <button>ケンの趣味を見る</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="card.html">
            <button>ケンが作ったポケモン神経衰弱</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="#">
            <button>製作中</button>
        </a>
    </div>
    <div class="button-circle">
        <a href="#">

        </a>
    </div>
    <div class="button-circle">
        <a href="chris.html">
            <button>Merry Christmas!</button>
        </a>
    </div>
</body>
</html>
