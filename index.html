<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        background: linear-gradient(135deg, #1a1a1a, #4a4a4a); /* 深色漸層背景 */
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .center-circle {
        width: 300px;
        height: 300px;
        background: linear-gradient(#e51d25, white);
        border-radius: 50%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 8px solid #333;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .center-circle::after {
        content: '';
        position: absolute;
        width: 60px;
        height: 60px;
        background: #fff;
        border-radius: 50%;
        border: 8px solid #333;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    h1 {
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        font-size: 1.5em;
        z-index: 1;
        text-align: center;
    }

    .button-circle {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
    }

    /* 不同屬性的按鈕顏色 */
    .button-circle:nth-child(2) { background: linear-gradient(145deg, #ff6b6b, #ff4757); top: 20%; left: 30%; transform: translate(-50%, -50%); } /* 火屬性 */
    .button-circle:nth-child(3) { background: linear-gradient(145deg, #48dbfb, #0abde3); top: 20%; right: 30%; transform: translate(50%, -50%); } /* 水屬性 */
    .button-circle:nth-child(4) { background: linear-gradient(145deg, #1dd1a1, #10ac84);  top: 15%; left: 50%; transform: translate(-50%, -50%);} /* 草屬性 */
    .button-circle:nth-child(5) { background: linear-gradient(145deg, #ffd32a, #ffa502); top: 50%; left: 20%; transform: translate(-50%, -50%); } /* 電屬性 */
    .button-circle:nth-child(6) { background: linear-gradient(145deg, #ff9ff3, #f368e0); top: 50%; right: 20%; transform: translate(50%, -50%); } /* 超能力屬性 */
    .button-circle:nth-child(7) { background: linear-gradient(145deg, #a4b0be, #747d8c); bottom: 20%; left: 30%; transform: translate(-50%, 50%);  } /* 鋼屬性 */
    .button-circle:nth-child(8) { background: linear-gradient(145deg, #5f27cd, #341f97); bottom: 20%; right: 25%; transform: translate(-50%, 50%); } /* 幽靈屬性 */
    .button-circle:nth-child(9) { background: linear-gradient(145deg, #ff9f43, #ee5253); bottom: 10%; left: 50%; transform: translateX(-50%); } /* 龍屬性 */

    .button-circle button {
        background: transparent;
        border: none;
        color: white;
        font-weight: bold;
        font-size: 0.9em;
        cursor: pointer;
        padding: 10px;
        width: 100%;
        height: 100%;
        border-radius: 50%;
    }

</style>
    <body>
        <div class="center-circle">
            <h1>ケンのことをもっと知っておこう！</h1>
        </div>
        <div class="button-circle">
            <a href="study_game.html">
                <button>基本情報技術者試験勉強ゲーム</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="shopping.html">
                <button>ポケモンショップ</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="index.html">
                <button>ホームページへ</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="hobby.html">
                <button>ケンの趣味を見る</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="card.html">
                <button>ケンが作ったポケモン神経衰弱</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="#">
                <button>製作中</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="#">
                <button>製作中</button>
            </a>
        </div>
        <div class="button-circle">
            <a href="chris.html">
                <button>Merry Christmas!</button>
            </a>
        </div>
    </body>
</html>
